<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3a5a2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Хутор — лето у бабушки</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%238db35b'/><path d='M2 8 8 3l6 5z' fill='%23b0503c'/><rect x='4' y='8' width='8' height='6' fill='%23a26b3d'/><rect x='6' y='10' width='3' height='3' fill='%23ffd47a'/></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="tl" class="pill"><img id="coin-ico" class="ico" alt=""><span id="coins">0</span></div>
  <div id="tc" class="pill"><img id="sun-ico" class="ico" alt=""><span id="clock">06:00</span><small id="day">День 1</small></div>
  <div id="tr">
    <button id="btn-stage" class="pill" aria-label="Развитие"><img id="stage-ico" class="ico" alt=""><span id="stage-name">Хутор</span><span class="minibar"><i id="stage-bar"></i></span></button>
    <button id="btn-gear" class="round small" aria-label="Настройки"></button>
  </div>
  <button id="hint" class="hidden"></button>
  <div id="br">
    <button id="btn-build" class="round big hidden" aria-label="Стройка"></button>
    <button id="btn-bag" class="round big hidden" aria-label="Рюкзак"></button>
  </div>
  <div id="buildbar" class="hidden"></div>
  <div id="toast"></div>
</div>

<div id="panel-wrap" class="hidden"><div id="panel"></div></div>
<div id="fade"></div>
<div id="nofile" class="hidden"></div>

<script>
  // Браузеры не запускают ES-модули с file:// — подскажем, как открыть игру.
  if (location.protocol === 'file:') {
    var n = document.getElementById('nofile');
    n.classList.remove('hidden');
    n.innerHTML = '<h2>Хутор</h2><p>Браузер не разрешает запускать игру прямо из файла.</p>' +
      '<p>Запусти <b>start.command</b> (Mac) или <b>start.bat</b> (Windows) рядом с этим файлом — игра откроется сама.</p>' +
      '<p>Или открой игру по ссылке GitHub Pages.</p>';
  }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
